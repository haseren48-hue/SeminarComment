<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f685e"><title>SeminarComment — 匿名コメント</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="brand">SC</span><span>SeminarComment</span><select id="language" aria-label="Language / 言語"><option value="ja">日本語</option><option value="en">English</option></select></header><section id="join"><p class="eyebrow" data-i18n="セミナーに参加">セミナーに参加</p><h1 data-i18n="そのひとことを、スクリーンへ。">そのひとことを、スクリーンへ。</h1><p class="intro" data-i18n="名前もログインも不要。Room Codeを入力して参加できます。">名前もログインも不要。Room Codeを入力して参加できます。</p><form id="joinForm"><label for="room">Room Code</label><input id="room" placeholder="8FJ2KD" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" required><button id="joinButton" data-i18n="参加する">参加する</button></form></section><section id="posting" hidden><p class="eyebrow" data-i18n="匿名コメント">匿名コメント</p><h1 id="sessionName"></h1><p class="intro" data-i18n="30文字で、気づきや感想を送れます。">30文字で、気づきや感想を送れます。</p><form id="commentForm"><label for="comment" data-i18n="コメント">コメント</label><input id="comment" placeholder="この結果おもしろい 🐭" data-i18n-placeholder="この結果おもしろい 🐭" autocomplete="off" enterkeyhint="send" required aria-describedby="count"><div class="meta"><span data-i18n="スクリーンには本文だけが表示されます">スクリーンには本文だけが表示されます</span><span id="count">0 / 30</span></div><button id="send" data-i18n="送信する">送信する</button></form></section><p id="status" role="status" aria-live="polite"></p><footer data-i18n="コメント本文の履歴は保存しません。">コメント本文の履歴は保存しません。</footer></main><div id="toast" role="status" hidden><strong data-i18n="送信しました">送信しました</strong><span id="sentText"></span></div><script type="module" src="/app.mjs"></script></body></html>

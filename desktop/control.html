<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>SeminarComment</title><link rel="stylesheet" href="control.css"></head><body><main><header><span class="mark">SC</span><div><small>LIVE COMMENTS FOR SEMINARS</small><h1>SeminarComment <small id="version"></small></h1></div></header><label class="language-picker">Language / 言語<select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label><p id="status" role="status" data-i18n="準備中…">準備中…</p><section><h2 data-i18n="セッション">セッション</h2><label for="mode" data-i18n="利用方法">利用方法</label><select id="mode"><option value="local" data-i18n="このPCで試す（設定不要）">このPCで試す（設定不要）</option><option value="quick" data-i18n="スマホから参加">スマホから参加</option><option value="external" data-i18n="設置済みサーバーを使う">設置済みサーバーを使う</option></select><p id="modeNotice" class="hint"></p><form id="sessionForm"><label for="name" data-i18n="セッション表示名">セッション表示名</label><div class="row"><input id="name" required maxlength="100" placeholder="研究室セミナー" data-i18n-placeholder="研究室セミナー"><button id="start" data-i18n="開始">開始</button></div></form><div id="session" hidden><h3 id="sessionName"></h3><div class="room"><span id="roomCode"></span><button id="qr" type="button" data-i18n="QRを表示">QRを表示</button></div><div id="qrTools" hidden><div class="actions"><button id="qrFold" type="button" class="subtle" data-i18n="QRをタブにしまう">QRをタブにしまう</button><button id="qrReset" type="button" class="subtle" data-i18n="QRの位置・大きさを戻す">QRの位置・大きさを戻す</button></div><p class="hint" data-i18n="QRカードの上部をドラッグで移動、端または＋／−でサイズ変更。タブにしまってもコメントは流れます。">QRカードの上部をドラッグで移動、端または＋／−でサイズ変更。タブにしまってもコメントは流れます。</p></div><p id="joinUrl"></p><small id="expiry"></small><button id="openParticipant" type="button" data-i18n="参加ページを開く">参加ページを開く</button><button id="end" class="subtle" type="button" data-i18n="セッションを終了">セッションを終了</button></div></section><section><h2 data-i18n="オーバーレイ">オーバーレイ</h2><label for="display" data-i18n="表示先ディスプレイ">表示先ディスプレイ</label><select id="display"></select><div class="row"><label><span data-i18n="文字サイズ">文字サイズ</span><select id="fontSize"><option value="24">24 px</option><option value="36">36 px</option><option value="48">48 px</option><option value="60">60 px</option><option value="72">72 px</option></select></label><label><span data-i18n="速度">速度</span><select id="speed"><option value="slow" data-i18n="遅い">遅い</option><option value="normal" data-i18n="普通">普通</option><option value="fast" data-i18n="速い">速い</option></select></label></div><div class="actions"><button id="visible" type="button">コメント表示 ON</button><button id="edit" type="button" class="subtle" data-i18n="表示領域を編集">表示領域を編集</button><button id="test" type="button" class="subtle" data-i18n="テストコメント">テストコメント</button><button id="clear" type="button" class="subtle" data-i18n="全コメント消去">全コメント消去</button></div><p class="hint" data-i18n="このウィンドウを閉じると、メニューバー／タスクトレイに収納します。">このウィンドウを閉じると、メニューバー／タスクトレイに収納します。</p><p class="hint" id="shortcuts"></p><p class="hint" id="testCount"></p><p class="hint" id="shortcutErrors" role="alert"></p></section><details id="externalConfig"><summary data-i18n="接続設定（初回のみ）">接続設定（初回のみ）</summary><form id="configForm"><label for="serverUrl" data-i18n="サーバーURL">サーバーURL</label><input id="serverUrl" type="url" required placeholder="https://comments.example.org"><label for="presenterKey" data-i18n="セッション作成キー">セッション作成キー</label><input id="presenterKey" type="password" autocomplete="off" placeholder="未設定" data-i18n-placeholder="未設定"><p class="hint" data-i18n="運用者から受け取ったURLとキーを入力します。">運用者から受け取ったURLとキーを入力します。</p><button id="save" type="submit" data-i18n="設定を保存">設定を保存</button></form></details></main><script type="module" src="control.mjs"></script></body></html>
